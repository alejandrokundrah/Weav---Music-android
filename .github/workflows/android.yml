# Builds an installable Android APK. Run it from the Actions tab ("Run workflow"), then download
# the artifact from the finished run.
#
# Two variants (the "variant" input):
#   phone - arm64 only, phone layout. Artifact: `weav-android-apk` (weav-android.apk).
#   tv    - arm64 + 32-bit armv7 in one APK, always the desktop layout, and a manifest that
#           declares Android TV support. Artifact: `weav-android-tv-apk` (weav-android-tv.apk).
#           The armv7 part matters: many TVs (Mali-450 era SoCs) are 32-bit only and refuse an
#           arm64-only APK as "not compatible".
#
# The Android project (src-tauri/gen/android) is generated here with `tauri android init` rather
# than checked in, so there is no generated Gradle tree to keep in sync with the Tauri version.
#
# Signing: an unsigned APK cannot be installed. With the ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets set, the APK is signed with that key
# (use the same key every time, or phones will refuse to update over an older install). Without
# them a throwaway key is generated, which is fine for trying the app out.
name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for publishing, for example v1.2.4"
        required: false
        type: string
      variant:
        description: "Which APK to build"
        type: choice
        options:
          - phone
          - tv
        default: phone

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_REPO: alejandrokundrah/weav-releases
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      NDK_VERSION: 27.2.12479018
      VARIANT: ${{ inputs.variant || 'phone' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        # The runner image has the Android SDK (ANDROID_HOME) but sdkmanager is not on PATH.
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "sdkmanager not found under ${ANDROID_HOME}"; ls "${ANDROID_HOME}/cmdline-tools"; exit 1; }
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null || true
          set -o pipefail
          "$sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Select the variant
        # VITE_TV is read by the frontend build (`beforeBuildCommand` inherits this environment)
        # and switches the app to its always-desktop TV layout.
        run: |
          if [ "$VARIANT" = "tv" ]; then
            echo "VITE_TV=1" >> "$GITHUB_ENV"
            echo "TARGETS=--target aarch64 --target armv7" >> "$GITHUB_ENV"
            echo "APK_NAME=weav-android-tv.apk" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=weav-android-tv-apk" >> "$GITHUB_ENV"
          else
            echo "TARGETS=--target aarch64" >> "$GITHUB_ENV"
            echo "APK_NAME=weav-android.apk" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=weav-android-apk" >> "$GITHUB_ENV"
          fi

      - name: Generate the Android project
        run: npx tauri android init --ci

      - name: Apply the app launcher icons
        # `tauri android init` leaves its own placeholder icon in the generated project, so the
        # real ones in src-tauri/icons/android are copied over it explicitly.
        run: |
          res=src-tauri/gen/android/app/src/main/res
          test -d src-tauri/icons/android || { echo "src-tauri/icons/android is missing"; exit 1; }
          rm -f "$res"/mipmap-*/ic_launcher*.png "$res"/mipmap-anydpi-v26/ic_launcher*.xml
          cp -r src-tauri/icons/android/. "$res/"
          ls -R "$res" | grep -i launcher

      - name: Patch the Android manifest
        run: |
          app=src-tauri/gen/android/app/src/main
          manifest="$app/AndroidManifest.xml"

          for permission in INTERNET WAKE_LOCK; do
            grep -q "android.permission.${permission}\"" "$manifest" || \
              sed -i "s#<application#<uses-permission android:name=\"android.permission.${permission}\" />\n    <application#" "$manifest"
          done

          # Lets the <audio> element reach the app's own 127.0.0.1 media server.
          mkdir -p "$app/res/xml"
          cp src-tauri/android/network_security_config.xml "$app/res/xml/network_security_config.xml"
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config"#' "$manifest"

          cat "$manifest"

      - name: Patch the manifest for Android TV
        if: env.VARIANT == 'tv'
        run: |
          manifest=src-tauri/gen/android/app/src/main/AndroidManifest.xml

          # A TV has no touchscreen and is not required to be a leanback device either: both
          # features are declared optional so the package manager (and sideload installers)
          # do not reject the APK, and so it still installs on phones and tablets.
          python3 - "$manifest" <<'PY'
          import re, sys
          path = sys.argv[1]
          xml = open(path, encoding="utf-8").read()

          features = (
              '<uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n'
              '    <uses-feature android:name="android.software.leanback" android:required="false" />\n'
              '    '
          )
          if "android.software.leanback" not in xml:
              xml = xml.replace("<application", features + "<application", 1)

          # Show up on the Android TV home screen, not only in a phone-style launcher.
          if "LEANBACK_LAUNCHER" not in xml:
              xml, n = re.subn(
                  r'(<category android:name="android.intent.category.LAUNCHER"\s*/>)',
                  r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
                  xml, count=1)
              if n != 1:
                  sys.exit("could not find the LAUNCHER intent category to extend")

          # Leanback launchers need a banner; the launcher icon stands in for a 320x180 one.
          if "android:banner" not in xml:
              xml = xml.replace("<application", '<application android:banner="@mipmap/ic_launcher"', 1)

          open(path, "w", encoding="utf-8").write(xml)
          PY

          grep -q 'android.software.leanback' "$manifest"
          grep -q 'LEANBACK_LAUNCHER' "$manifest"
          cat "$manifest"

      - name: Build
        # The updater artifacts need a signing key and the updater plugin is desktop-only.
        # $TARGETS is intentionally unquoted: it expands to repeated --target flags.
        run: >
          npx tauri android build --apk $TARGETS
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          unsigned=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          test -n "$unsigned" || { echo "no unsigned APK found"; exit 1; }

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            KEYSTORE_PASSWORD=weav-throwaway
            KEY_ALIAS=weav
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" \
              -dname "CN=WEAV" >/dev/null 2>&1
          fi

          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out "out/$APK_NAME" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "out/$APK_NAME"

          if [ "$VARIANT" = "tv" ]; then
            # Fail the run, not the user's TV, if a 32-bit library is missing from the APK.
            unzip -l "out/$APK_NAME" | grep -q 'lib/armeabi-v7a/' || { echo "no armeabi-v7a libs in the TV APK"; exit 1; }
            unzip -l "out/$APK_NAME" | grep -q 'lib/arm64-v8a/' || { echo "no arm64-v8a libs in the TV APK"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish APK to public release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --title "WEAV ${RELEASE_TAG#v}" --generate-notes
          gh release upload "$RELEASE_TAG" --repo "$RELEASE_REPO" "out/$APK_NAME" --clobber
